<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Spydroid WebRTC</title>
<style>
body {
  background:#10121a;
  color:white;
  font-family:Arial,sans-serif;
  display:grid;
  place-items:center;
  min-height:100vh;
  margin:0;
}
form {
  background:#202433;
  padding:28px;
  border-radius:16px;
  width:min(320px,85vw);
}
input,button {
  box-sizing:border-box;
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:9px;
  font-size:16px;
}
input {border:1px solid #555;background:#151722;color:white;}
button {border:0;background:#7555ed;color:white;}
#error {color:#ff9999;}
</style>
</head>
<body>
<form id="login">
<h2>Spydroid WebRTC</h2>
<p>Вход администратора</p>
<input name="username" placeholder="Логин" autocomplete="username" required>
<input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
<button type="submit">Войти</button>
<p id="error"></p>
</form>
<script>
document.getElementById('login').onsubmit = async (event) => {
  event.preventDefault();
  const form = event.target;
  const error = document.getElementById('error');
  error.textContent = '';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: form.username.value,
        password: form.password.value
      })
    });

    if (!response.ok) throw new Error('Неверный логин или пароль');
    location.href = '/';
  } catch (e) {
    error.textContent = e.message;
  }
};
</script>
</body>
</html>
